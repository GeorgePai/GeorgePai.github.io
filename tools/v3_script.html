<script>
const STATS_URL = "https://pp-stats.alphapotato.workers.dev";
const ONLINE_EVERY = 30000;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches || !!(navigator.connection && navigator.connection.saveData);
const play = `<svg viewBox="0 0 6 7" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h2v7H0zM2 1h2v5H2zM4 2h1v3H4zM5 3h1v1H5z" fill="currentColor"/></svg>`;
let games = [];

function card(g, i){
  const m = g.media || {};
  const vid = !calm && (m.mp4 || m.webm) ? `<video muted loop playsinline preload="none" ${m.poster ? `poster="${esc(m.poster)}"` : ""}>${m.webm ? `<source src="${esc(m.webm)}" type="video/webm">` : ""}${m.mp4 ? `<source src="${esc(m.mp4)}" type="video/mp4">` : ""}</video>` : "";
  return `<article class="card win n2" data-i="${i}"><div class="bd n1"><div class="in">
    <a class="media" href="${esc(g.path)}" aria-label="開始玩 ${esc(g.name)}">${m.poster ? `<img src="${esc(m.poster)}" alt="" ${i ? 'loading="lazy"' : ""}>` : ""}${vid}</a>
    <div class="info">
      <h2 class="name stroke">${esc(g.name)}</h2>
      <div class="stats">
        <span class="chip win dim n2"><span class="bd n1"><span class="in" data-on="${i}"><i class="led"></i>— 人在線</span></span></span>
        <span class="chip win dim n2"><span class="bd n1"><span class="in">${esc(g.version)}</span></span></span>${g.badge ? `
        <span class="chip win hot n2"><span class="bd n1"><span class="in">${esc(g.badge)}</span></span></span>` : ""}
      </div>
      <div class="btns"><a class="btn primary n2" href="${esc(g.path)}"><span class="n1">${play}開始玩</span></a><button class="btn n2" type="button" data-notes="${i}"><span class="n1">更新內容</span></button></div>
    </div>
  </div></div></article>`;
}

// 只播放畫面中那張卡片的影片
const vio = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  const v = e.target.querySelector("video"); if (!v) return;
  if (e.isIntersecting && !document.hidden) { if (v.preload === "none") { v.preload = "auto"; v.load(); } v.play().catch(()=>{}); }
  else v.pause();
}), {threshold: .5}) : null;

const list = $("#games");
function openNotes(i){
  const g = games[i]; if (!g) return;
  $("#mTitle").textContent = `${g.name} ${g.version}`;
  $("#mWhen").textContent = `更新日期 ${g.date}`;
  $("#mNotes").innerHTML = (g.notes || []).map(n => `<li>${esc(n)}</li>`).join("") || "<li>這版沒有更新說明</li>";
  $("#mPlay").href = g.path;
  $("#mask").classList.add("show"); $("#mClose").focus();
}
const closeNotes = () => $("#mask").classList.remove("show");
list.addEventListener("click", e => { const b = e.target.closest("[data-notes]"); if (b) openNotes(+b.dataset.notes); });
$("#mClose").onclick = closeNotes;
$("#mask").addEventListener("click", e => { if (e.target.id === "mask") closeNotes(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeNotes(); });

async function pollOnline(){
  if (document.hidden) return;
  await Promise.all(games.map(async (g, i) => {
    if (!g.online) return; let n = null;
    try { const j = await (await fetch(g.online, {cache: "no-store"})).json(); if (j && j.ok && Number.isFinite(+j.n)) n = +j.n; } catch (e) {}
    const el = document.querySelector(`[data-on="${i}"]`); if (el) el.innerHTML = `<i class="led ${n > 0 ? "on" : ""}"></i>${n == null ? "—" : n} 人在線`;
  }));
}
let timer = null;
function startPolling(){ clearInterval(timer); pollOnline(); timer = setInterval(pollOnline, ONLINE_EVERY); }
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { clearInterval(timer); list.querySelectorAll("video").forEach(v => v.pause()); }
  else startPolling();
});

async function views(){
  const KEY = "pp_last_hit", now = Date.now(); let last = 0;
  try { last = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const hit = now - last > 30*60*1000;
  try {
    const j = await (await fetch(STATS_URL + (hit ? "/hit" : "/stats"), {method: hit ? "POST" : "GET"})).json();
    if (Number.isFinite(+j.views)) $("#views").textContent = (+j.views).toLocaleString("zh-TW");
    if (hit) try { localStorage.setItem(KEY, String(now)); } catch (e) {}
  } catch (e) {}
}

fetch("/games.json", {cache: "no-store"}).then(r => r.json()).then(d => {
  games = d.games || [];
  list.innerHTML = games.map(card).join("");
  list.querySelectorAll(".card").forEach(c => {
    const v = c.querySelector("video"); if (!v) return;
    v.addEventListener("playing", () => v.classList.add("ready"), {once: true});
    if (vio) vio.observe(c);
  });
  startPolling();
}).catch(() => { list.innerHTML = '<p style="color:var(--mute)">遊戲清單載入失敗，請重新整理。</p>'; });
views();
</script>
</body>
</html>
